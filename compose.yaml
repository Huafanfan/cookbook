name: cookbook

services:
  app:
    image: cookbook:server
    build:
      # 在服务器上源码位于 /srv/app/cookbook/source，构建上下文即该目录
      context: "${COOKBOOK_BUILD_CONTEXT:-.}"
      dockerfile: Dockerfile
    container_name: cookbook
    restart: unless-stopped
    init: true
    # 只绑定局域网地址，不监听 0.0.0.0
    ports:
      - "${COOKBOOK_BIND:-192.168.1.2}:${COOKBOOK_PORT:-18081}:${COOKBOOK_INTERNAL_PORT:-8080}"
    environment:
      NODE_ENV: production
      COOKBOOK_HOST: 0.0.0.0
      COOKBOOK_PORT: "${COOKBOOK_INTERNAL_PORT:-8080}"
      COOKBOOK_DATA_DIR: /data
      # 密钥只在服务器受保护的环境文件中配置，前端构建不读取。
      DS_BASE_URL: "${DS_BASE_URL:-https://api.deepseek.com}"
      DS_AUTH_TOKEN: "${DS_AUTH_TOKEN:-}"
      DS_MODEL: "${DS_MODEL:-deepseek-flash}"
    volumes:
      # 数据目录**需要可写**：用户状态（点赞/收藏）由应用运行期写入
      # `data/user-state.json`（见 docs/decisions/ADR-0003-write-operations-user-state.md）。
      # 编辑、历史与创意工坊新建同样写入 /data；容器根文件系统仍是 read_only。
      - type: bind
        source: "${COOKBOOK_DATA_DIR:-/srv/data/cookbook}"
        target: /data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    stop_grace_period: 10s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
